<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pieces — Len Perez UX Portfolio</title>
    <meta name="description" content="UX and Product Design portfolio for Len Perez showcasing case studies, interactive projects, and graphic design work." />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon-dark.svg" />
    <link rel="mask-icon" href="/favicon-dark.svg" color="#60A5FA" />
    <link rel="apple-touch-icon" href="/favicon-dark.svg" />
    <style>
      html, body { min-h: 100%; margin: 0; background-color: #0a0a0a; color: #ffffff; }
      html.light, html.light body { background-color: #F5F5F5; color: #0a0a0a; }
      #root { min-height: 100vh; }
    </style>
    <script>
      (function() {
        try {
          var userPref = localStorage.getItem('theme_preference');
          var isDark = userPref ? userPref === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var iconPath = isDark ? '/favicon-dark.svg' : '/favicon-light.svg';
          
          var existingIcons = document.querySelectorAll("link[rel*='icon'], link[rel*='mask-icon']");
          existingIcons.forEach(function(el) { el.remove(); });

          var iconLink = document.createElement('link');
          iconLink.rel = 'icon';
          iconLink.type = 'image/svg+xml';
          iconLink.setAttribute('sizes', 'any');
          iconLink.href = iconPath;
          document.head.appendChild(iconLink);

          var maskLink = document.createElement('link');
          maskLink.rel = 'mask-icon';
          maskLink.href = iconPath;
          maskLink.setAttribute('color', '#60A5FA');
          document.head.appendChild(maskLink);

          var touchLink = document.createElement('link');
          touchLink.rel = 'apple-touch-icon';
          touchLink.href = iconPath;
          document.head.appendChild(touchLink);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#0a0a0a';
            document.documentElement.style.color = '#ffffff';
            if (document.body) {
              document.body.style.backgroundColor = '#0a0a0a';
              document.body.style.color = '#ffffff';
            }
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F5F5F5';
            document.documentElement.style.color = '#0a0a0a';
            if (document.body) {
              document.body.style.backgroundColor = '#F5F5F5';
              document.body.style.color = '#0a0a0a';
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
