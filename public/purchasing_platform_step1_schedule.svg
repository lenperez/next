    <rect x="602.5" y="0" width="52.5" height="22" fill="#2b2b2b" />
    <text x="628.75" y="15" class="week-text" text-anchor="middle">WEEK 8</text>

    <rect x="655" y="0" width="52.5" height="22" fill="#2b2b2b" />
    <text x="681.25" y="15" class="week-text" text-anchor="middle">WEEK 9</text>

    <rect x="707.5" y="0" width="52.5" height="22" fill="#2b2b2b" />
