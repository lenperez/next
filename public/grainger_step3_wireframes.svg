        <text x="540" y="12">State</text>
        <rect x="540" y="20" width="230" height="30" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
        <text x="555" y="40" fill="#64748b">drop down</text>
        <path d="M 740,35 L 746,41 L 752,35" fill="none" stroke="#1e293b" stroke-width="2" />

        <!-- Address lines -->
        <text x="0" y="75">Address</text>
        <rect x="0" y="83" width="230" height="26" fill="#ffffff" stroke="#334155" stroke-width="1" />
        <text x="15" y="101" font-size="11" fill="#64748b">Address Line 1</text>
        <rect x="0" y="114" width="230" height="26" fill="#ffffff" stroke="#334155" stroke-width="1" />
        <text x="15" y="132" font-size="11" fill="#64748b">Address Line 2</text>
        <rect x="0" y="145" width="230" height="26" fill="#ffffff" stroke="#334155" stroke-width="1" />
        <text x="15" y="163" font-size="11" fill="#64748b">Address Line 3</text>
        <rect x="0" y="176" width="230" height="26" fill="#ffffff" stroke="#334155" stroke-width="1" />
        <text x="15" y="194" font-size="11" fill="#64748b">Address Line 14</text>

        <text x="270" y="75">ZIP Code</text>
        <rect x="270" y="83" width="230" height="30" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
        <text x="285" y="103" font-family="monospace" fill="#64748b">######-####</text>

        <text x="270" y="132">Tax Code</text>
        <rect x="270" y="140" width="230" height="30" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
        <text x="285" y="160" fill="#64748b">Code</text>
        <rect x="510" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
