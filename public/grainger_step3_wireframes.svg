          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(320, 0)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(480, 0)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(640, 0)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 36)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(160, 36)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(320, 36)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(480, 36)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
        <g transform="translate(640, 36)">
          <rect width="22" height="22" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
          <path d="M 4,11 L 9,16 L 18,5" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text x="32" y="16">check box</text>
        </g>
      </g>

      <!-- Customer PO & Fulfillment DC -->
      <g transform="translate(0, 115)" font-size="12" fill="#334155">
        <text x="0" y="12">Customer PO</text>
        <rect x="0" y="20" width="215" height="28" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
        <text x="15" y="38" fill="#64748b">Code</text>

        <text x="260" y="12">Fulfillment DC</text>
        <rect x="260" y="20" width="215" height="28" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
        <text x="275" y="38" fill="#64748b">Code</text>
        <rect x="490" y="20" width="28" height="28" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
        <circle cx="501" cy="31" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <line x1="504.5" y1="34.5" x2="510" y2="40" stroke="#1e293b" stroke-width="1.5" />
        <text x="530" y="38" font-size="14" fill="#334155">Company Name</text>
