<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Clean Canvas -->
  <rect width="1100" height="950" fill="#ffffff" />

  <!-- Wireframe Content -->
  <g transform="translate(50, 40)">
    <!-- Top Customer & Ship To -->
    <g>
      <text x="0" y="15" font-size="14" font-weight="600" fill="#1e293b">Customer</text>
      <rect x="0" y="24" width="240" height="32" fill="#ffffff" stroke="#334155" stroke-width="1.4" />
      <text x="15" y="46" font-size="14" font-family="monospace" fill="#334155">#########</text>
      <rect x="255" y="24" width="32" height="32" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.4" />
      <circle cx="269" cy="38" r="5" fill="none" stroke="#1e293b" stroke-width="1.8" />
      <line x1="272.5" y1="41.5" x2="278" y2="47" stroke="#1e293b" stroke-width="1.8" />
      <text x="305" y="46" font-size="14" fill="#334155">Customer Name</text>
    </g>

    <g transform="translate(500, 0)">
      <text x="0" y="15" font-size="14" font-weight="600" fill="#1e293b">Ship To:</text>
      <rect x="0" y="24" width="240" height="32" fill="#ffffff" stroke="#334155" stroke-width="1.4" />
      <text x="15" y="46" font-size="14" fill="#64748b">Location Code</text>
      <rect x="255" y="24" width="32" height="32" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.4" />
      <circle cx="269" cy="38" r="5" fill="none" stroke="#1e293b" stroke-width="1.8" />
      <line x1="272.5" y1="41.5" x2="278" y2="47" stroke="#1e293b" stroke-width="1.8" />
      <text x="305" y="46" font-size="14" fill="#334155">Location Name</text>
    </g>

    <!-- Navigation Tabs: [ Main ] [ Subsidy ] [ Shoes ] -->
