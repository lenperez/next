      <rect x="0" y="0" width="170" height="46" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="170" height="5" fill="#0f172a" />
      <text x="85" y="28" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Main</text>

      <rect x="180" y="10" width="170" height="36" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
