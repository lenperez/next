<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 920" width="1150" height="920" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#005596" />
    </marker>

    <!-- Diamond Shape Component (Center at 0,0, radius 40x26) -->
    <!-- Node Styles -->
      <marker id="arrow-start" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#005596" />
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1150" height="920" fill="#ffffff" />

  <!-- ======================================================== -->
  <!-- CONNECTORS & FLOW PATHS (Behind Nodes)                   -->
  <!-- Color: #005596, Width: 1.8                               -->
  <!-- ======================================================== -->
  <g fill="none" stroke="#005596" stroke-width="1.8">

    <!-- 1. Home -> Login -->
    <line x1="135" y1="75" x2="175" y2="75" marker-end="url(#arrow)" />

    <!-- 2. Login -> Invalid & Valid splits -->
    <path d="M 225,120 L 225,140 L 160,140 L 160,165" marker-end="url(#arrow)" />
    <path d="M 225,120 L 225,140 L 275,140 L 275,165" marker-end="url(#arrow)" />

    <!-- 3. Invalid -> Error -> Sign-up -->
    <line x1="102" y1="205" x2="102" y2="255" marker-end="url(#arrow)" />
    <line x1="102" y1="295" x2="102" y2="330" marker-end="url(#arrow)" />

    <!-- 4. Valid -> Landing Page -->
    <line x1="275" y1="245" x2="275" y2="265" marker-end="url(#arrow)" />

    <!-- 5. Landing Page -> Browse & Search splits -->
    <path d="M 275,345 L 275,370 L 218,370 L 218,390" marker-end="url(#arrow)" />
    <path d="M 275,345 L 275,370 L 332,370 L 332,390" marker-end="url(#arrow)" />

    <!-- 6. Browse -> Category Page, Favorites, Catalog -->
    <path d="M 218,460 L 218,485 L 102,485 L 102,510" marker-end="url(#arrow)" />
    <line x1="218" y1="460" x2="218" y2="510" marker-end="url(#arrow)" />
    <path d="M 218,460 L 218,485 L 334,485 L 334,510" marker-end="url(#arrow)" />

    <!-- Category / Favorites / Catalog <-> Filter Diamonds (Double-ended arrows) -->
    <line x1="102" y1="615" x2="102" y2="650" marker-end="url(#arrow)" marker-start="url(#arrow-start)" />
    <line x1="218" y1="615" x2="218" y2="650" marker-end="url(#arrow)" marker-start="url(#arrow-start)" />
    <line x1="334" y1="615" x2="334" y2="650" marker-end="url(#arrow)" marker-start="url(#arrow-start)" />

    <!-- Long horizontal feed from Catalog/Browse cluster into Product Detail Page -->
    <path d="M 102,485 L 445,485 L 445,510" marker-end="url(#arrow)" />

    <!-- 7. Search -> Search Results Pages -->
    <path d="M 390,425 L 485,425 L 485,395" marker-end="url(#arrow)" />

    <!-- Search Results Pages <-> Filter (Double-ended arrow) -->
    <line x1="480" y1="285" x2="480" y2="255" marker-end="url(#arrow)" marker-start="url(#arrow-start)" />

    <!-- Search Results Pages -> Product Detail Page -->
    <line x1="508" y1="395" x2="508" y2="510" marker-end="url(#arrow)" />

    <!-- 8. Product Detail Page -> Paint Color Selection -->
    <line x1="552" y1="560" x2="590" y2="560" marker-end="url(#arrow)" />

    <!-- Paint Color Selection -> Cart -->
    <path d="M 638,475 L 638,135" marker-end="url(#arrow)" />

    <!-- Direct route from Product Detail Page into Cart -->
    <path d="M 552,530 L 577,530 L 577,80 L 588,80" marker-end="url(#arrow)" />

    <!-- Product Detail Page -> Service Details -> Generated Email -->
    <line x1="485" y1="615" x2="485" y2="640" marker-end="url(#arrow)" />
    <line x1="485" y1="730" x2="485" y2="755" marker-end="url(#arrow)" />

    <!-- 9. Cart -> Additional Information -> Checkout -->
    <line x1="685" y1="75" x2="705" y2="75" marker-end="url(#arrow)" />
    <line x1="795" y1="75" x2="820" y2="75" marker-end="url(#arrow)" />

    <!-- 10. Checkout -> Delivery Location -->
    <line x1="868" y1="125" x2="868" y2="150" marker-end="url(#arrow)" />

    <!-- 11. Delivery Location -> Invalid & Valid splits -->
    <path d="M 868,240 L 868,260 L 808,260 L 808,280" marker-end="url(#arrow)" />
    <path d="M 868,240 L 868,260 L 928,260 L 928,280" marker-end="url(#arrow)" />

    <!-- Delivery Location Error Loop -->
    <path d="M 752,320 L 752,240" marker-end="url(#arrow)" />
    <path d="M 752,185 L 752,185 L 815,185" marker-end="url(#arrow)" />

    <!-- Valid Delivery -> Payment Method -->
    <path d="M 928,360 L 928,390 L 868,390 L 868,410" marker-end="url(#arrow)" />

    <!-- 12. Payment Method -> Invalid & Valid splits -->
    <path d="M 868,500 L 868,520 L 808,520 L 808,540" marker-end="url(#arrow)" />
    <path d="M 868,500 L 868,520 L 928,520 L 928,540" marker-end="url(#arrow)" />

    <!-- Payment Method Error Loop -->
    <path d="M 752,580 L 752,500" marker-end="url(#arrow)" />
    <path d="M 752,445 L 752,445 L 815,445" marker-end="url(#arrow)" />

    <!-- Valid Payment -> Review / Submit -->
    <path d="M 928,620 L 928,655 L 868,655 L 868,675" marker-end="url(#arrow)" />

    <!-- 13. Review / Submit -> Approval Needed & Authorized splits -->
    <path d="M 868,765 L 868,785 L 808,785 L 808,805" marker-end="url(#arrow)" />
    <path d="M 868,765 L 868,785 L 928,785 L 928,805" marker-end="url(#arrow)" />

    <!-- Approval Needed -> Message -->
    <line x1="752,845" x2="728,845" marker-end="url(#arrow)" />

    <!-- Authorized -> Thank You / Order Review -->
    <line x1="984,845" x2="1008,845" marker-end="url(#arrow)" />
  </g>


  <!-- ======================================================== -->
  <!-- FLOWCHART NODES                                          -->
  <!-- ======================================================== -->

  <!-- ==- TOP LEFT: HOME & LOGIN ==- -->
  <!-- Home (Marketing) -->
  <g transform="translate(45, 30)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="44" font-size="12" fill="#1e293b" text-anchor="middle">Home</text>
    <text x="45" y="60" font-size="12" fill="#1e293b" text-anchor="middle">(Marketing)</text>
  </g>

  <!-- Login -->
  <g transform="translate(175, 30)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="52" font-size="12.5" fill="#1e293b" text-anchor="middle">Login</text>
  </g>

  <!-- Login Decision: Invalid Diamond -->
  <g transform="translate(160, 205)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Invalid</text>
  </g>

  <!-- Login Decision: Valid Diamond -->
  <g transform="translate(275, 205)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Valid</text>
  </g>

  <!-- Error (Red Dotted Oval) -->
  <g transform="translate(102, 275)">
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2.5,2.5" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Error</text>
  </g>

  <!-- Sign-up -->
  <g transform="translate(58, 330)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="52" font-size="12.5" fill="#1e293b" text-anchor="middle">Sign-up</text>
  </g>

  <!-- Landing Page -->
  <g transform="translate(228, 265)">
    <rect width="90" height="80" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="40" font-size="12.5" fill="#1e293b" text-anchor="middle">Landing</text>
    <text x="45" y="56" font-size="12.5" fill="#1e293b" text-anchor="middle">Page</text>
  </g>

  <!-- Browse Diamond -->
  <g transform="translate(218, 425)">
    <polygon points="0,-35 58,0 0,35 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Browse</text>
  </g>

  <!-- Search Diamond -->
  <g transform="translate(332, 425)">
    <polygon points="0,-35 58,0 0,35 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Search</text>
  </g>

  <!-- Category Page -->
  <g transform="translate(57, 510)">
    <rect width="90" height="105" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="50" font-size="12" fill="#1e293b" text-anchor="middle">Category</text>
    <text x="45" y="66" font-size="12" fill="#1e293b" text-anchor="middle">Page</text>
  </g>

  <!-- Favorites -->
  <g transform="translate(173, 510)">
    <rect width="90" height="105" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="58" font-size="12" fill="#1e293b" text-anchor="middle">Favorites</text>
  </g>

  <!-- Catalog -->
  <g transform="translate(289, 510)">
    <rect width="90" height="105" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="58" font-size="12" fill="#1e293b" text-anchor="middle">Catalog</text>
  </g>

  <!-- Filter Diamond (under Category) -->
  <g transform="translate(102, 685)">
    <polygon points="0,-35 58,0 0,35 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Filter</text>
  </g>

  <!-- Filter Diamond (under Favorites) -->
  <g transform="translate(218, 685)">
    <polygon points="0,-35 58,0 0,35 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Filter</text>
  </g>

  <!-- Filter Diamond (under Catalog) -->
  <g transform="translate(334, 685)">
    <polygon points="0,-35 58,0 0,35 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Filter</text>
  </g>


  <!-- ==- CENTER: SEARCH RESULTS & PRODUCT DETAIL ==- -->
  <!-- Filter Diamond (above Search Results Pages) -->
  <g transform="translate(480, 220)">
    <polygon points="0,-35 58,0 0,35 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Filter</text>
  </g>

  <!-- Stacked Cards: Search Results Pages -->
  <g transform="translate(430, 295)">
    <!-- Back card 2 -->
    <rect x="-8" y="-8" width="90" height="100" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
    <!-- Back card 1 -->
    <rect x="-4" y="-4" width="90" height="100" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
    <!-- Front card -->
    <rect x="0" y="0" width="90" height="100" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="38" font-size="12" fill="#1e293b" text-anchor="middle">Search</text>
    <text x="45" y="54" font-size="12" fill="#1e293b" text-anchor="middle">Results</text>
    <text x="45" y="70" font-size="12" fill="#1e293b" text-anchor="middle">Pages</text>
  </g>

  <!-- Product Detail Page -->
  <g transform="translate(465, 510)">
    <rect width="87" height="105" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="43" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Product</text>
    <text x="43" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Detail Page</text>
  </g>

  <!-- Paint Color Selection (Dotted Box) -->
  <g transform="translate(590, 510)">
    <rect width="90" height="105" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="45" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Paint Color</text>
    <text x="45" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Selection</text>
  </g>

  <!-- Service Details (Dotted Box) -->
  <g transform="translate(465, 640)">
    <rect width="87" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="43" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Service</text>
    <text x="43" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Details</text>
  </g>

  <!-- Generated Email (Yellow Dotted Box) -->
  <g transform="translate(465, 755)">
    <rect width="87" height="90" fill="#ffffff" stroke="#eab308" stroke-width="1.4" stroke-dasharray="2.5,2.5" />
    <text x="43" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Generated</text>
    <text x="43" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Email</text>
  </g>


  <!-- ==- TOP RIGHT: CART & CHECKOUT ==- -->
  <!-- Cart -->
  <g transform="translate(595, 35)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="52" font-size="12.5" fill="#1e293b" text-anchor="middle">Cart</text>
  </g>

  <!-- Additional Information (Dotted Box) -->
  <g transform="translate(705, 35)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="45" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Additional</text>
    <text x="45" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Information</text>
  </g>

  <!-- Checkout -->
  <g transform="translate(820, 35)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="52" font-size="12.5" fill="#1e293b" text-anchor="middle">Checkout</text>
  </g>

  <!-- Delivery Location (Dotted Box) -->
  <g transform="translate(823, 150)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="45" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Delivery</text>
    <text x="45" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Location</text>
  </g>

  <!-- Delivery Error (Red Dotted Oval) -->
  <g transform="translate(752, 215)">
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2.5,2.5" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Error</text>
  </g>

  <!-- Delivery Decision: Invalid Diamond -->
  <g transform="translate(808, 320)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Invalid</text>
  </g>

  <!-- Delivery Decision: Valid Diamond -->
  <g transform="translate(928, 320)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Valid</text>
  </g>

  <!-- Payment Method (Dotted Box) -->
  <g transform="translate(823, 410)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="45" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Payment</text>
    <text x="45" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Method</text>
  </g>

  <!-- Payment Error (Red Dotted Oval) -->
  <g transform="translate(752, 475)">
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2.5,2.5" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Error</text>
  </g>

  <!-- Payment Decision: Invalid Diamond -->
  <g transform="translate(808, 580)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Invalid</text>
  </g>

  <!-- Payment Decision: Valid Diamond -->
  <g transform="translate(928, 580)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Valid</text>
  </g>

  <!-- Review / Submit (Dotted Box) -->
  <g transform="translate(823, 675)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="45" y="45" font-size="12" fill="#1e293b" text-anchor="middle">Review /</text>
    <text x="45" y="61" font-size="12" fill="#1e293b" text-anchor="middle">Submit</text>
  </g>

  <!-- ==- BOTTOM RIGHT: APPROVALS & ORDER REVIEW ==- -->
  <!-- Final Decision: Approval Needed Diamond -->
  <g transform="translate(808, 845)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="-2" font-size="11.5" fill="#1e293b" text-anchor="middle">Approval</text>
    <text x="0" y="12" font-size="11.5" fill="#1e293b" text-anchor="middle">Needed</text>
  </g>

  <!-- Final Decision: Authorized Diamond -->
  <g transform="translate(928, 845)">
    <polygon points="0,-40 58,0 0,40 -58,0" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="0" y="4" font-size="12" fill="#1e293b" text-anchor="middle">Authorized</text>
  </g>

  <!-- Thank You / Approval Needed Message -->
  <g transform="translate(638, 800)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="34" font-size="11.5" fill="#1e293b" text-anchor="middle">Thank You /</text>
    <text x="45" y="48" font-size="11.5" fill="#1e293b" text-anchor="middle">Approval</text>
    <text x="45" y="62" font-size="11.5" fill="#1e293b" text-anchor="middle">Needed</text>
    <text x="45" y="76" font-size="11.5" fill="#1e293b" text-anchor="middle">Message</text>
  </g>

  <!-- Thank You / Order Review -->
  <g transform="translate(1008, 800)">
    <rect width="90" height="90" fill="#ffffff" stroke="#64748b" stroke-width="1.3" />
    <text x="45" y="38" font-size="11.5" fill="#1e293b" text-anchor="middle">Thank You /</text>
    <text x="45" y="54" font-size="11.5" fill="#1e293b" text-anchor="middle">Order</text>
    <text x="45" y="70" font-size="11.5" fill="#1e293b" text-anchor="middle">Review</text>
  </g>

</svg>
