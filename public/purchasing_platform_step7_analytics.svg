<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" style="background:#f5f7f9; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft Card Drop Shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <!-- Sparkline Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND CANVAS -->
  <rect width="1000" height="900" fill="#f5f7f9" />

  <!-- ======================================================== -->
  <!-- TOP HEADER BAR                                           -->
  <!-- ======================================================== -->
  <g transform="translate(30, 24)">
    <!-- Dashboard Title -->
    <text x="0" y="24" font-size="21" font-weight="700" fill="#1e293b">Visitor Insights Dashboard</text>

    <!-- Date Range Dropdown Button -->
    <g transform="translate(685, 0)">
      <rect x="0" y="4" width="255" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="25" font-size="14" font-weight="600" fill="#334155">Oct 1, 2014 - Oct 27, 2016</text>
      <!-- Downward Chevron -->
      <path d="M 234,17 L 240,23 L 246,17" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- SUB-HEADER ACTION BUTTONS -->
  <g transform="translate(30, 78)">
    <!-- Left Actions: + Add Widget, Share, Email, Export -->
    <text x="0" y="16" font-size="11" font-weight="600" fill="#334155">+ Add Widget</text>
    <line x1="82" y1="4" x2="82" y2="20" stroke="#cbd5e1" stroke-width="1" />

    <text x="96" y="16" font-size="11" font-weight="600" fill="#334155">Share</text>
    <path d="M 132,12 L 136,16 L 140,12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="152" y1="4" x2="152" y2="20" stroke="#cbd5e1" stroke-width="1" />

    <text x="166" y="16" font-size="11" font-weight="600" fill="#334155">Email</text>
    <line x1="204" y1="4" x2="204" y2="20" stroke="#cbd5e1" stroke-width="1" />

    <text x="218" y="16" font-size="11" font-weight="600" fill="#334155">Export</text>
    <path d="M 260,12 L 264,16 L 268,12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Actions: Customize Dashboard, Delete Dashboard -->
    <text x="716" y="16" font-size="11.5" font-weight="600" fill="#334155">Customize Dashboard</text>
    <text x="860" y="16" font-size="11.5" font-weight="600" fill="#334155">Delete Dashboard</text>
  </g>

  <!-- ======================================================== -->
  <!-- SEGMENTS BAR (Top 2 Cards)                               -->
  <!-- ======================================================== -->
  <!-- Segment 1: All Sessions (Active) -->
  <g transform="translate(30, 115)" filter="url(#cardShadow)">
    <rect width="470" height="68" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Donut Ring Chart -->
    <circle cx="42" cy="34" r="16" fill="none" stroke="#0284c7" stroke-width="6" />
    <text x="74" y="29" font-size="12.5" font-weight="700" fill="#1e293b">All Sessions</text>
    <text x="74" y="46" font-size="11.5" fill="#64748b">100.00%</text>
  </g>

  <!-- Segment 2: + Add Segment (Dashed) -->
  <g transform="translate(520, 115)">
    <rect width="450" height="68" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3" />
    <!-- Dashed circle -->
    <circle cx="38" cy="34" r="16" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <text x="68" y="39" font-size="13" font-weight="600" fill="#64748b">+ Add Segment</text>
  </g>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN WIDGETS                                      -->
  <!-- ======================================================== -->

  <!-- WIDGET 1: Unique visitors (KPI Card) -->
  <g transform="translate(30, 205)" filter="url(#cardShadow)">
    <rect width="380" height="125" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Title -->
    <text x="16" y="28" font-size="13.5" font-weight="700" fill="#1e3a8a">Unique visitors</text>
    <!-- Value -->
    <text x="16" y="66" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">281,023</text>
    <!-- Subtext -->
    <text x="16" y="86" font-size="11" fill="#64748b">% of Total: 100.00% (281,023)</text>

    <!-- Sparkline on right -->
    <g transform="translate(290, 48)">
      <polygon points="0,28 10,20 20,26 30,16 40,24 50,18 60,25 70,22 70,36 0,36" fill="url(#sparkGrad)" />
      <path d="M 0,28 Q 5,19 10,20 T 20,26 T 30,16 T 40,24 T 50,18 T 60,25 T 70,22" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- WIDGET 2: New users (KPI Card) -->
  <g transform="translate(30, 348)" filter="url(#cardShadow)">
    <rect width="380" height="110" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Title -->
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#1e3a8a">New users</text>
    <!-- Value -->
    <text x="16" y="62" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">60.72%</text>
    <!-- Subtext -->
    <text x="16" y="82" font-size="11" fill="#64748b">Site Avg: 60.72% (0.00%)</text>

    <!-- Sparkline on right -->
    <g transform="translate(290, 52)">
      <rect x="0" y="16" width="70" height="18" fill="url(#sparkGrad)" />
      <line x1="0" y1="16" x2="70" y2="16" stroke="#0284c7" stroke-width="2" />
    </g>
  </g>

  <!-- WIDGET 3: Visitors' favorite browsers (Data Table Card) -->
  <g transform="translate(30, 476)" filter="url(#cardShadow)">
    <rect width="380" height="295" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Title -->
    <text x="16" y="30" font-size="13.5" font-weight="700" fill="#1e3a8a">Visitors' favorite browsers</text>
    <line x1="16" y1="44" x2="364" y2="44" stroke="#f1f5f9" stroke-width="1" />

    <!-- Table Header -->
    <g transform="translate(16, 68)" font-size="11.5" font-weight="700" fill="#1e293b">
      <text x="0" y="0">Browser</text>
      <text x="235" y="0" text-anchor="end">Users</text>
      <text x="345" y="0" text-anchor="end">Bounce Rate</text>
    </g>
    <line x1="16" y1="78" x2="364" y2="78" stroke="#e2e8f0" stroke-width="1" />

    <!-- Table Rows -->
    <!-- Row 1: Chrome -->
    <g transform="translate(16, 108)" font-size="12" fill="#1e293b">
      <text x="0" y="0" font-weight="500">Chrome</text>
      <text x="235" y="0" text-anchor="end">161,398</text>
      <text x="345" y="0" text-anchor="end">70.61%</text>
    </g>
    <line x1="16" y1="120" x2="364" y2="120" stroke="#f8fafc" stroke-width="1" />

    <!-- Row 2: Internet Explorer -->
    <g transform="translate(16, 148)" font-size="12" fill="#1e293b">
      <text x="0" y="0" font-weight="500">Internet Explorer</text>
      <text x="235" y="0" text-anchor="end">68,844</text>
      <text x="345" y="0" text-anchor="end">70.86%</text>
    </g>
    <line x1="16" y1="160" x2="364" y2="160" stroke="#f8fafc" stroke-width="1" />

    <!-- Row 3: Safari -->
    <g transform="translate(16, 188)" font-size="12" fill="#1e293b">
      <text x="0" y="0" font-weight="500">Safari</text>
      <text x="235" y="0" text-anchor="end">29,945</text>
      <text x="345" y="0" text-anchor="end">72.77%</text>
    </g>
    <line x1="16" y1="200" x2="364" y2="200" stroke="#f8fafc" stroke-width="1" />

    <!-- Row 4: Firefox -->
    <g transform="translate(16, 228)" font-size="12" fill="#1e293b">
      <text x="0" y="0" font-weight="500">Firefox</text>
      <text x="235" y="0" text-anchor="end">12,907</text>
      <text x="345" y="0" text-anchor="end">70.23%</text>
    </g>
    <line x1="16" y1="240" x2="364" y2="240" stroke="#f8fafc" stroke-width="1" />

    <!-- Row 5: Safari (in-app) -->
    <g transform="translate(16, 268)" font-size="12" fill="#1e293b">
      <text x="0" y="0" font-weight="500">Safari (in-app)</text>
      <text x="235" y="0" text-anchor="end">2,906</text>
      <text x="345" y="0" text-anchor="end">89.06%</text>
    </g>
  </g>


  <!-- ======================================================== -->
  <!-- RIGHT COLUMN WIDGETS                                     -->
  <!-- ======================================================== -->

  <!-- WIDGET 4: Unique visitors (Timeline Line Chart) -->
  <g transform="translate(430, 205)" filter="url(#cardShadow)">
    <rect width="540" height="315" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Title -->
    <text x="18" y="28" font-size="13.5" font-weight="700" fill="#1e3a8a">Unique visitors</text>
    <!-- Divider -->
    <line x1="18" y1="42" x2="522" y2="42" stroke="#f1f5f9" stroke-width="1" />

    <!-- Legend: Users -->
    <circle cx="26" cy="62" r="5" fill="#0284c7" />
    <text x="38" y="66" font-size="12" font-weight="600" fill="#1e293b">Users</text>

    <!-- Chart Canvas -->
    <g transform="translate(25, 78)">
      <!-- Y-Axis Labels -->
      <text x="40" y="22" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="end">20,000</text>
      <text x="40" y="86" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="end">10,000</text>

      <!-- Horizontal Grid Lines -->
      <line x1="48" y1="18" x2="490" y2="18" stroke="#e2e8f0" stroke-width="1" />
      <line x1="48" y1="82" x2="490" y2="82" stroke="#e2e8f0" stroke-width="1" />
      <line x1="48" y1="148" x2="490" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

      <!-- Timeline Chart Curve with Dots -->
      <!-- Points roughly:
           Oct 14 cycle: starts 50,110 -> 75,106 -> 90,135 -> 120,145 -> 150,88 -> 170,72 -> 195,58 -> 220,58 -> 240,78 -> 260,132 -> 280,145
           Oct 15 cycle: -> 300,90 -> 325,72 -> 350,76 -> 370,88 -> 390,140 -> 410,145
           Oct 16 cycle: -> 430,95 -> 450,86 -> 470,68 -> 490,120 -> 505,116 -> 525,124
      -->
      <polyline points="
        50,110 75,106 90,135 120,145 150,88 170,72 195,58 220,58 240,78 260,132 280,145 
        300,90 325,72 350,76 370,88 390,140 410,145 
        430,95 450,86 470,68 490,120 505,116 525,124
      " fill="none" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Circular Data Marker Dots -->
      <circle cx="50" cy="110" r="3.5" fill="#0284c7" />
      <circle cx="75" cy="106" r="3.5" fill="#0284c7" />
      <circle cx="90" cy="135" r="3.5" fill="#0284c7" />
      <circle cx="120" cy="145" r="3.5" fill="#0284c7" />
      <circle cx="150" cy="88" r="3.5" fill="#0284c7" />
      <circle cx="170" cy="72" r="3.5" fill="#0284c7" />
      <circle cx="195" cy="58" r="4" fill="#0284c7" />
      <circle cx="220" cy="58" r="4" fill="#0284c7" />
      <circle cx="240" cy="78" r="3.5" fill="#0284c7" />
      <circle cx="260" cy="132" r="3.5" fill="#0284c7" />
      <circle cx="280" cy="145" r="3.5" fill="#0284c7" />
      <circle cx="300" cy="90" r="3.5" fill="#0284c7" />
      <circle cx="325" cy="72" r="4" fill="#0284c7" />
      <circle cx="350" cy="76" r="4" fill="#0284c7" />
      <circle cx="370" cy="88" r="3.5" fill="#0284c7" />
      <circle cx="390" cy="140" r="3.5" fill="#0284c7" />
      <circle cx="410" cy="145" r="3.5" fill="#0284c7" />
      <circle cx="430" cy="95" r="3.5" fill="#0284c7" />
      <circle cx="450" cy="86" r="3.5" fill="#0284c7" />
      <circle cx="470" cy="68" r="4" fill="#0284c7" />
      <circle cx="490" cy="120" r="3.5" fill="#0284c7" />
      <circle cx="505" cy="116" r="3.5" fill="#0284c7" />
      <circle cx="525" cy="124" r="3.5" fill="#0284c7" />

      <!-- X-Axis Labels -->
      <text x="48" y="168" font-size="9" fill="#94a3b8">...</text>
      <text x="195" y="168" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Oct '14</text>
      <text x="345" y="168" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Oct '15</text>
      <text x="470" y="168" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Oct '16</text>
    </g>
  </g>


  <!-- WIDGET 5: Top 5 screen resolutions (Horizontal Bar Chart) -->
  <g transform="translate(430, 540)" filter="url(#cardShadow)">
    <rect width="540" height="340" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Title -->
    <text x="18" y="28" font-size="13.5" font-weight="700" fill="#1e3a8a">Top 5 screen resolutions</text>
    <line x1="18" y1="40" x2="522" y2="40" stroke="#f1f5f9" stroke-width="1" />

    <!-- Chart Canvas -->
    <g transform="translate(30, 52)">
      <!-- Rotated Y-Axis Label: Screen Resolution -->
      <text x="-120" y="10" transform="rotate(-90)" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">Screen Resolution</text>

      <!-- Vertical Grid Lines (Corresponding to 10k, 25k, 40k, 55k, 70k) -->
      <!-- Left axis line at x=28 -->
      <line x1="28" y1="12" x2="28" y2="242" stroke="#cbd5e1" stroke-width="1" />
      <line x1="138" y1="12" x2="138" y2="242" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="248" y1="12" x2="248" y2="242" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="358" y1="12" x2="358" y2="242" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="468" y1="12" x2="468" y2="242" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Horizontal Bars in Rich Azure Blue -->
      <!-- Bar 1: 1366x768 (Width = 378px) -->
      <rect x="28" y="24" width="378" height="34" fill="#0284c7" />
      <text x="36" y="46" font-size="11.5" font-weight="700" fill="#ffffff">1366x768</text>

      <!-- Bar 2: 1920x1080 (Width = 374px) -->
      <rect x="28" y="68" width="374" height="34" fill="#0284c7" />
      <text x="36" y="90" font-size="11.5" font-weight="700" fill="#ffffff">1920x1080</text>

      <!-- Bar 3: 1440x900 (Width = 132px) -->
      <rect x="28" y="112" width="132" height="34" fill="#0284c7" />
      <text x="36" y="134" font-size="11.5" font-weight="700" fill="#ffffff">1440x900</text>

      <!-- Bar 4: 1280x800 (Width = 98px) -->
      <rect x="28" y="156" width="98" height="34" fill="#0284c7" />
      <text x="36" y="178" font-size="11.5" font-weight="700" fill="#ffffff">1280x800</text>

      <!-- Bar 5: 1600x900 (Width = 48px) -->
      <rect x="28" y="200" width="48" height="34" fill="#0284c7" />
      <text x="36" y="222" font-size="10.5" font-weight="700" fill="#ffffff">1600x900</text>

      <!-- Bottom Axis Ticks & Numbers -->
      <g transform="translate(0, 258)" font-size="10" font-weight="500" fill="#64748b">
        <text x="28" y="0" text-anchor="middle">10,000</text>
        <text x="138" y="0" text-anchor="middle">25,000</text>
        <text x="248" y="0" text-anchor="middle">40,000</text>
        <text x="358" y="0" text-anchor="middle">55,000</text>
        <text x="468" y="0" text-anchor="middle">70,000</text>
      </g>

      <!-- Bottom Axis Label: Users -->
      <text x="248" y="274" font-size="11.5" font-style="italic" font-weight="600" fill="#475569" text-anchor="middle">Users</text>
    </g>
  </g>
</svg>
