<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#ffffff; font-family:'Times New Roman', 'Baskerville', 'Georgia', serif;">
  <defs>
    <!-- Soft Studio Backdrop Vignette -->
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#fcfcfc" />
      <stop offset="100%" stop-color="#f5f5f7" />
    </radialGradient>

    <!-- Top Energy Bar Gradient (Yellow / Gold) with Left Fade -->
    <linearGradient id="yellowEnergyFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="18%" stop-color="#fef8e2" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#fbeba2" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#f8de79" stop-opacity="1" />
      <stop offset="100%" stop-color="#f5d565" stop-opacity="1" />
    </linearGradient>

    <!-- Bottom Energy Bar Gradient (Olive / Chartreuse Green) with Left Fade -->
    <linearGradient id="greenEnergyFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#f1f6d8" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#cde07a" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#b2cc50" stop-opacity="1" />
      <stop offset="100%" stop-color="#a4c244" stop-opacity="1" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Red Focal Bar -->
    <filter id="barDepth" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- PURE CLEAN EDITORIAL CANVAS -->
  <rect width="1200" height="675" fill="url(#cardBg)" />

  <!-- SUBTLE ARCHITECTURAL BRAND GRID LINES -->
  <g opacity="0.05" stroke="#18181b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675" />
    <line x1="1120" y1="0" x2="1120" y2="675" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="555" x2="1200" y2="555" />
  </g>

  <!-- TOP BRAND REBRAND METADATA -->
  <g transform="translate(80, 75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="11" font-weight="800" fill="#a11b2d" letter-spacing="1.5">BAKER &amp; MᶜKENZIE</text>
    <text x="155" y="0" font-size="11" font-weight="500" fill="#71717a">• Law Firm Visual Rebrand &amp; Collateral System</text>
    <g transform="translate(1040, 0)" text-anchor="end">
      <text x="0" y="0" font-size="10.5" font-weight="600" fill="#a1a1aa" letter-spacing="1">THEME: FLOW OF MOTION</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- SIGNATURE "ENERGY BARS" COMPOSITION                      -->
  <!-- ======================================================== -->
  <!-- Centered vertically in canvas (y = 220 to 455) -->
  <g transform="translate(0, 235)">
    
    <!-- 1. TOP ENERGY BAR (GOLD / WARM YELLOW FADE) -->
    <!-- Starts with gradient fade from left at x=30, extends to x=1095 -->
    <rect x="30" y="0" width="1065" height="58" fill="url(#yellowEnergyFade)" />

    <!-- 2. BOTTOM ENERGY BAR (CHARTREUSE / OLIVE GREEN FADE) -->
    <!-- Starts with gradient fade around x=310, extends to full right x=1200 -->
    <rect x="310" y="146" width="890" height="58" fill="url(#greenEnergyFade)" />

    <!-- 3. CENTER PRIMARY ENERGY BAR (DEEP CRIMSON RED BURGUNDY) -->
    <!-- Crisp bold rectangular start at x=55, spans full width to x=1200 -->
    <g filter="url(#barDepth)">
      <rect x="55" y="58" width="1145" height="88" fill="#a11b2d" />
      <!-- Subtle internal highlight rim -->
      <line x1="55" y1="58.5" x2="1200" y2="58.5" stroke="#b9293e" stroke-width="1" />
      <line x1="55" y1="145.5" x2="1200" y2="145.5" stroke="#871324" stroke-width="1" />

      <!-- WORDMARK: BAKER & MᶜKENZIE -->
      <!-- Classic white serif lettering aligned to right side of red energy bar -->
      <g transform="translate(1135, 114)" text-anchor="end">
        <text font-family="'Times New Roman', 'Baskerville', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="1.5">
          BAKER &amp; M<tspan dy="-11" font-size="28" font-weight="700">C</tspan><tspan dy="11" font-size="44" font-weight="700">KENZIE</tspan>
        </text>
        <!-- Historic Period Dot Under the Raised 'C' -->
        <circle cx="-168" cy="-1" r="2.2" fill="#ffffff" />
      </g>
    </g>

  </g>

  <!-- BOTTOM DESIGN RATIONALE CAPTION -->
  <g transform="translate(80, 595)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#27272a">ZÜN PARTNERS</text>
    <text x="110" y="0" font-size="11" fill="#71717a">• Dynamic multi-tier color bars conveying the ever-evolving nature of international law</text>
    <g transform="translate(1040, 0)" text-anchor="end">
      <text x="0" y="0" font-size="11" font-weight="600" fill="#a11b2d">Identity System &amp; Print Suite</text>
    </g>
  </g>

</svg>
